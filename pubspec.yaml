name: famzone
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # HTTP client for talking to the FamZone API.
  http: ^1.2.0

  # Keychain / Keystore backed storage for the auth token.
  flutter_secure_storage: ^9.2.2

  # Camera and gallery access for the avatar picker.
  image_picker: ^1.1.2
  flutter_timezone: ^5.1.0
  image_cropper: ^12.2.1
  web_socket_channel: ^3.0.3
  file_picker: 8.3.7
  url_launcher: ^6.3.2

  # Previewing a reminder tone in the editor. Only ever plays a bundled asset —
  # the notification itself is sounded by the OS from res/raw, not from here.
  audioplayers: ^6.8.1

  # Voice notes.
  #
  # record captures and reports the input level for the live
  # waveform; just_audio plays back with seeking and speed;
  # audio_session is what stops iOS routing playback to the earpiece
  # after a recording; path_provider gives the temp file a home,
  # which record requires explicitly from v5 on.
  record: ^7.1.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  path_provider: ^2.1.0

  # Live location.
  #
  # geolocator is the position stream, the permission ladder and the
  # platform-specific settings that decide how hard the GPS works —
  # everything except drawing. It needs no API key and costs nothing.
  #
  # google_maps_flutter is only the drawing, and it is the one that
  # needs a key. Keeping that distinction clear matters: the whole
  # tracking pipeline works without a key, so a missing or throttled
  # key degrades to "no map", never to "no location".
  #
  # No permission_handler: geolocator already covers every location
  # permission on both platforms, and a second permissions plugin is
  # two sources of truth for one answer. It comes back if and when
  # notifications need one.
  # ^14.0.2, not ^14.0.3, and the reason is worth writing down.
  #
  # 14.0.3 added a geolocator_linux dependency that pulls in win32 ^6,
  # while file_picker is pinned at 8.3.7 and wants win32 ^5.9. Neither
  # package is ever compiled into an Android or iOS build — win32 is
  # Windows-desktop, geolocator_linux is Linux — but pub has to solve
  # for every declared platform, so it fails anyway.
  #
  # The caret still permits 14.0.3 and above. Pub simply picks 14.0.2
  # today and will move up on its own the day file_picker is upgraded
  # past its win32 ^5.9 pin. Nothing in this app uses anything added
  # in 14.0.3.
  geolocator: ^14.0.2
  google_maps_flutter: ^2.5.0

  # Battery percentage, reported alongside each position.
  #
  # A family member's phone at 6% is often the most actionable thing on the
  # map — it is why they will stop answering in twenty minutes. The column
  # and the wire format have existed since the first version of location;
  # this is what finally reads the number.
  #
  # No permissions on either platform: the level is public API on Android
  # and iOS alike.
  battery_plus: ^6.2.1

  # Reminders.
  #
  # flutter_local_notifications registers real OS alarms, which is the
  # whole reason reminders work with no signal, on a plane, and with the
  # app force-closed. Nothing about the moment a reminder rings touches
  # the network — the server owns what the reminders are, the phone owns
  # when they go off.
  #
  # timezone is not optional alongside it. zonedSchedule takes a
  # TZDateTime, and without initializeTimeZones plus an explicit
  # setLocalLocation the library treats every schedule as UTC. The
  # failure is quiet and seasonal: alarms land at the right instant in
  # the wrong zone, so a 7am reminder rings at 12:30pm in India and
  # nothing in the logs says why.
  #
  # flutter_timezone was already here for the check-in's local day and
  # supplies the IANA name that setLocalLocation needs.
  #
  # No permission_handler, still. flutter_local_notifications asks for
  # notifications and for the Android 12+ exact-alarm permission through
  # its own platform implementations, so a second permissions plugin
  # would be two sources of truth for one answer.
  #
  # ^19.5.0 and not ^22, deliberately, and the caret is capped by the
  # major so pub cannot drift past it.
  #
  # v20 converted every positional parameter on initialize(), show(),
  # cancel() and zonedSchedule() to named parameters. The changelog
  # names the affected methods and does not publish the new parameter
  # spellings, so writing against 22 means guessing at four signatures —
  # and a guess that is wrong does not degrade, it fails to compile.
  # 19.5.0 is the last release this code is written against and known
  # correct for.
  #
  # Upgrading later is a contained job: reminder_scheduler.dart is the
  # only file that touches this package, and the only changes are
  # turning four call sites into named arguments. 21.0.0 also raises the
  # floor to Flutter 3.38.1 / Dart 3.10 and Android API 24 — this
  # project is on Flutter 3.47 with minSdk 24, so that part already
  # holds.
  #
  # timezone ^0.10.0 is what 19.5.0 itself depends on. Pinned to the
  # same range rather than guessed: 22.x moved to ^0.11.0, and a
  # mismatch here is a resolution failure rather than a runtime one.
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true


  # Asset folders. Adding a folder here bundles every file directly inside
  # it — new files are picked up without editing this list again.
  # Density variants in 2.0x/ and 3.0x/ subfolders are resolved automatically.
  assets:
    - assets/logo/
    - assets/images/
    - assets/icons/
    # Not covered by the line above: asset directories are not recursive.
    - assets/icons/services/

    # Reminder tones. The same .wav files also live in
    # android/app/src/main/res/raw/ — an Android notification channel can only
    # take its sound from a raw resource, and Dart can only read an asset, so
    # each tone has to exist in both places. Keep the two folders identical.
    - assets/tones/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
